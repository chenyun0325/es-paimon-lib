apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: es-paimon
  namespace: es-paimon-test
spec:
  serviceName: es-paimon-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: es-paimon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-paimon
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-config-and-keystore
          image: es-paimon:9.4.0-1.0.7-r10
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              readonly ES_HOME=/usr/share/elasticsearch
              export ES_PATH_CONF=/mnt/config

              if [[ -z "${PAIMON_OSS_ACCESS_KEY_SECRET}" ]]; then
                echo 'Secret paimon-oss-credentials/access-key-secret is empty' >&2
                exit 1
              fi

              # This init container is deliberately non-root. Even plain `cp -R source/. target/`
              # tries to copy the source directory timestamps onto the EmptyDir mount root and
              # fails with EPERM, so explicitly copy content without any preserved attributes.
              umask 0027
              mkdir -p "${ES_PATH_CONF}"
              cp -R --no-preserve=all \
                "${ES_HOME}/config/." "${ES_PATH_CONF}/"
              cp --no-preserve=all \
                /mnt/user-config/elasticsearch.yml "${ES_PATH_CONF}/elasticsearch.yml"

              # Always create a fresh keystore in the pod-local EmptyDir. This avoids carrying
              # image ownership or an incompatible seed file into the writable config volume.
              rm -f "${ES_PATH_CONF}/elasticsearch.keystore"
              "${ES_HOME}/bin/elasticsearch-keystore" create
              printf '%s\n' "${PAIMON_OSS_ACCESS_KEY_SECRET}" \
                | "${ES_HOME}/bin/elasticsearch-keystore" add \
                    --stdin --force paimon.oss.access_key_secret

              "${ES_HOME}/bin/elasticsearch-keystore" list \
                | grep -Fxq 'paimon.oss.access_key_secret'
              test -r "${ES_PATH_CONF}/elasticsearch.yml"
              test -r "${ES_PATH_CONF}/elasticsearch.keystore"
              echo 'Elasticsearch config and Paimon OSS keystore are ready'
          env:
            - name: PAIMON_OSS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: paimon-oss-credentials
                  key: access-key-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-work
              mountPath: /mnt/config
            - name: user-config
              mountPath: /mnt/user-config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
      containers:
        - name: elasticsearch
          image: es-paimon:9.4.0-1.0.7-r10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          env:
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
            # Elasticsearch's environment-variable escaping maps this to
            # paimon.oss.access_key_id. The secret never enters cluster state.
            - name: ES_SETTING_PAIMON_OSS_ACCESS__KEY__ID
              valueFrom:
                secretKeyRef:
                  name: paimon-oss-credentials
                  key: access-key-id
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config-work
              mountPath: /usr/share/elasticsearch/config
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: config-work
          emptyDir: {}
        - name: user-config
          configMap:
            name: es-paimon-config
            items:
              - key: elasticsearch.yml
                path: elasticsearch.yml
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
